name: Opdater DMR koeretoejsdata

on:
  schedule:
    # MIDLERTIDIGT: kl. 10:44 UTC i dag, til test af automatisk trigger
    - cron: '44 10 * * *'
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Begraens til N koeretoejer (tom = fuld koersel)'
        required: false
        default: ''
      force:
        description: 'Tving koersel selvom filen er uaendret siden sidst'
        required: false
        type: boolean
        default: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Saet Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hent og byg DMR-database
        env:
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python3 -u scripts/hent_og_filtrer_dmr.py

      - name: Commit og push opdateret data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/koeretoejer.db data/last_processed.txt
          git diff --cached --quiet && echo "Ingen aendringer i data" || git commit -m "Automatisk opdatering af DMR-data"
          git push
